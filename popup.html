<!DOCTYPE html>
<html>
  <head>
    <title>Close Specific URL</title>
  </head>
  <body
    style="
      background-image: radial-gradient(circle at 90% 0%, #6bcfc3, #000807);
    "
  >
    <div
      style="
        width: 320px;
        min-width: 320px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 10px;
      "
    >
      <div style="display: flex; justify-content: center">
        <img
          src="https://iconape.com/wp-content/files/jw/371598/svg/371598.svg"
          alt="upwork"
          width="180"
        />
      </div>
      <div>
        <span id="title" style="color: #6bcfc3"></span>
        <span id="timer" style="color: #6bcfc3"></span>
      </div>
      <input
        type="text"
        id="url"
        placeholder="Enter URL"
        style="width: full; height: 24px; font-size: 16px"
      />
      <div>
        <input
          type="number"
          id="time"
          min="0"
          max="23"
          step="1"
          placeholder="Enter time"
          style="width: 240px; height: 24px; font-size: 16px"
        />
        <span style="font-weight: bold; color: white">o'clock</span>
      </div>
      <div style="width: full; display: flex; justify-content: space-between">
        <div>
          <button
            id="closeButton"
            style="
              padding: 12px;
              color: white;
              background-color: #03a9f4;
              border-radius: 2px;
              outline: none;
              border: none;
              cursor: pointer;
            "
          >
            Set time and url
          </button>
          <button
            id="openButton"
            style="
              padding: 12px;
              color: white;
              background-color: #03a9f4;
              border-radius: 2px;
              outline: none;
              border: none;
              cursor: pointer;
            "
          >
            Open url
          </button>
        </div>
        <button
          id="runButton"
          style="
            padding: 12px;
            color: white;
            background-color: #03a9f4;
            border-radius: 2px;
            outline: none;
            border: none;
            cursor: pointer;
          "
        >
          Run
        </button>
      </div>
      <hr width="100%" />
      <div>
        <div style="width: 100%; background-color: white">
          <textarea
            style="
              width: 100%;
              border: none;
              padding: 0;
              outline: none;
            "
            rows="3"
            id="refreshSiteUrl"
          ></textarea>
        </div>
        <div style="display: flex; justify-content: space-between; margin-top: 4px;">
          <div>
            <input
              type="number"
              placeholder="Refreshing period"
              id="refreshPeriod"
              style="width: 80px; height: 24px; font-size: 16px"
            />
            <span style="color: white">min</span>
          </div>
          <button
            id="refreshRun"
            style="
              padding: 12px;
              color: white;
              background-color: #03a9f4;
              border-radius: 2px;
              outline: none;
              border: none;
              cursor: pointer;
            "
          >
            RUN
          </button>
        </div>
      </div>
      <script src="popup.js"></script>
    </div>
  </body>
</html>
